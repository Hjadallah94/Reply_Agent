<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Reply Agent{% endblock %}</title>
<style>
  :root {
    --bg: #f5f7f6;
    --surface: #ffffff;
    --border: #dbe3df;
    --text: #17211d;
    --text-muted: #5c6b64;
    --accent: #2a6b58;
    --pending-bg: #f7ecd8;
    --pending-fg: #8a5a1f;
    --resolved-bg: #e4f1e8;
    --resolved-fg: #226147;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header a { color: var(--text); text-decoration: none; font-weight: 600; }
  header .biz { color: var(--text-muted); font-size: 14px; }
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 18px; }
  h2 { font-size: 1.05rem; margin: 28px 0 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  a.card-link { display: block; text-decoration: none; color: inherit; }
  a.card-link:hover { border-color: var(--accent); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .muted { color: var(--text-muted); font-size: 13.5px; }
  .badge {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.pending { background: var(--pending-bg); color: var(--pending-fg); }
  .badge.resolved { background: var(--resolved-bg); color: var(--resolved-fg); }
  .badge.auto { background: var(--resolved-bg); color: var(--resolved-fg); }
  .badge.owner_handled { background: var(--pending-bg); color: var(--pending-fg); }
  .badge.closed { background: #ececea; color: #5b5f5a; }
  .empty { color: var(--text-muted); padding: 20px 0; }
  .thread { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .bubble { padding: 10px 13px; border-radius: 8px; max-width: 80%; font-size: 14.5px; }
  .bubble.customer { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; }
  .bubble.agent { background: var(--resolved-bg); align-self: flex-end; }
  .bubble .meta { display: block; font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .reason {
    background: var(--pending-bg);
    color: var(--pending-fg);
    border-radius: 8px;
    padding: 10px 13px;
    font-size: 14px;
    margin-bottom: 18px;
  }
  textarea {
    width: 100%;
    min-height: 120px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14.5px;
    resize: vertical;
  }
  button {
    margin-top: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.92; }
  .back { display: inline-block; margin-bottom: 14px; color: var(--text-muted); font-size: 13.5px; text-decoration: none; }
  .back:hover { color: var(--accent); }
  .export-link {
    font-size: 13.5px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .export-link:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <a href="/dashboard">Reply Agent</a>
  {% if business %}<span class="biz">— {{ business.name }}</span>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
