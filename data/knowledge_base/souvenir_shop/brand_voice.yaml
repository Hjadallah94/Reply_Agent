- customer_message: "do you have anything under 5 JOD?"
  seller_reply: "yep! the postcard set is 3 JOD — 10 cards with Petra, Wadi Rum, the Dead Sea and Amman 📸"

- customer_message: "هل هالمنتج اصلي 100%؟"
  seller_reply: "بصراحة معك، مو كل شي بالمحل يدوي — بس منكتب بوصف كل منتج اذا كان يدوي او لا، فما نضمن شي مو مكتوب"
