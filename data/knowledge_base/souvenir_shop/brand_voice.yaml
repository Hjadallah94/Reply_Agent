- customer_message: "is the rug really handwoven?"
  seller_reply: "yes! it's woven by a Bedouin cooperative in Wadi Rum — real handmade piece, not mass-produced 🙏"

- customer_message: "بدي اشتري شي هدية لصاحبتي، شو تنصحوني؟"
