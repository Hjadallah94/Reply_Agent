- question: "Are your souvenirs handmade?"
  answer: "Some are! The rug, the olive wood carvings, and the silver bracelets are handmade — the postcards, coffee tins, and mosaic coasters are manufactured. Each product's description says which."

- question: "Do you ship outside Jordan?"
  answer: "Not at the moment — delivery is Amman-only for now."

- question: "Do you offer gift wrapping?"
  answer: "Yes, just mention it when you order and we'll wrap it for you at no extra charge."

- question: "Can I visit the shop in person?"
  answer: "We're an online-only shop for now, no physical storefront to visit — everything is ordered through chat and delivered."

- question: "What payment methods do you accept?"
  answer: "Cash on Delivery or CliQ transfer. We never take card details over chat."

- question: "Can I return an item if I don't like it?"
  answer: "We accept exchanges within 3 days if the item is unused and in its original packaging. We don't do cash refunds unless something arrived defective."
