- question: "Do you bake to order or is everything ready-made?"
  answer: "We bake in small batches throughout the day, so most orders are baked fresh for you rather than sitting around — that's part of why we need a little lead time before delivery."

- question: "Can I mix flavors in one box?"
  answer: "Of course! Just tell us which flavors and how many of each, and we'll put together a mixed box for you."

- question: "Do you deliver outside Amman?"
  answer: "Not at the moment — we currently only deliver within Amman."

- question: "Can I schedule a delivery for a specific time tomorrow?"
  answer: "Yes, just let us know the day and rough time you'd like, and we'll confirm it can work before locking it in."
