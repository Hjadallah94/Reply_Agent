- question: "Do you ship outside Jordan?"
  answer: "Not at the moment — we currently only deliver within Jordan."

- question: "Can I try the abaya before paying?"
  answer: "We don't offer try-before-you-buy, but exchanges are available within 3 days if the size doesn't fit (see our returns policy)."

- question: "How do I know my size?"
  answer: "Most of our abayas run true to standard Jordanian sizing (S/M/L). If you tell us your usual size in other local shops, we're happy to help you pick."
