- topic: delivery
  content: >
    Delivery within Amman takes 1-2 business days, 3 JOD delivery fee.
    Outside Amman (other governorates) takes 2-4 business days via Aramex, 4 JOD delivery fee.
    Free delivery on orders over 60 JOD within Amman.

- topic: payment
  content: >
    Cash on Delivery (COD) is available everywhere we deliver.
    CliQ transfer is also accepted — CliQ alias is sent after the order is confirmed.

- topic: returns
  content: >
    Exchanges are accepted within 3 days of delivery if the item is unworn and has its tags,
    for a size/color swap only — no cash refunds. Customer covers the return delivery fee.

- topic: hours
  content: >
    We reply to messages daily between 9am and 10pm Amman time. Orders placed after 10pm
    are confirmed the next morning.
