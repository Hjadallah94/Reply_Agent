[project]
name = "reply-agent"
version = "0.1.0"
description = "Autonomous LangGraph agent that replies to Instagram, WhatsApp, and Facebook Messenger DMs for solo/small online sellers in Jordan."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.13",
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
    "rq>=2.1.0",
    "voyageai>=0.3.1",
    "pyyaml>=6.0.2",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "jinja2>=3.1.4",
    "bcrypt>=4.2.0",
    "itsdangerous>=2.2.0",
    "pywebpush>=2.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(fn)` — a function call in an
# argument default everywhere else, but the correct pattern here, not the B008 mutable-default
# footgun that rule exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# db/session.py's get_engine()/get_sessionmaker() are process-lifetime @lru_cache singletons
# (correct for production, one event loop). Without this, pytest-asyncio's default per-test
# event loop breaks that cache across tests ("Event loop is closed") the moment more than one
# test touches the DB.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.uv]
# This project lives under OneDrive — its cloud-file placeholders are incompatible with
# uv's default hardlink cache strategy ("os error 396"). Copying is slightly slower but works.
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reply_agent"]
