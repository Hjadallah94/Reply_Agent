services:
  - type: web
    name: reply-agent-web-staging
    runtime: python
    plan: free
    # Editable, not a regular install: knowledge/loader.py's DATA_DIR resolves relative to its
    # own __file__, walking up to the repo root — true when the package lives in the checkout
    # (editable, same as local dev's `uv run`), not when pip copies it into site-packages at a
    # different depth. That only matters for scripts/seed_business.py's demo data today (real
    # businesses' knowledge comes from uploads, not these YAML files), but the fix needs to be
    # portable, not a one-off.
    buildCommand: pip install -e .
    startCommand: uvicorn reply_agent.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: META_GRAPH_API_VERSION
        value: v21.0
      - key: VOYAGE_EMBEDDING_MODEL
        value: voyage-3.5
      # Safe default: outbound sends only log until deliberately flipped for a live test,
      # same reasoning as the local .env default.
      - key: META_DRY_RUN
        value: "true"
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: DATABASE_URL_APP
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: reply-agent-redis-staging
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      # New for this branch's delivery-estimation feature (Doc 2 Section 9.5) — real per-call
      # cost, unlike every Meta API used elsewhere.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: META_PAGE_SIGNUP_CONFIG_ID
        sync: false
      - key: OWNER_NOTIFICATION_WHATSAPP_NUMBER
        sync: false

  - type: worker
    name: reply-agent-worker-staging
    runtime: python
    plan: starter
    buildCommand: pip install -e .
    startCommand: python scripts/run_worker.py
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: META_GRAPH_API_VERSION
        value: v21.0
      - key: VOYAGE_EMBEDDING_MODEL
        value: voyage-3.5
      - key: META_DRY_RUN
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: DATABASE_URL_APP
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: reply-agent-redis-staging
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false

  - type: redis
    name: reply-agent-redis-staging
    # Render allows only one free-tier Key Value instance per account, and production's
    # reply-agent-redis already uses it — found live when the first sync attempt failed.
    plan: starter
    ipAllowList: []
