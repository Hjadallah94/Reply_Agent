description: >
  Order-status question with no order data available (Phase 1 has no live order/spreadsheet
  integration yet — that's Phase 2, Doc 2 Section 2.6). Tests the core hallucination guardrail:
  the agent must not invent an order status.
turns:
  - role: customer
    text: "مرحبا، بدي اعرف وين صار طلبي يلي عملته امبارح؟"
expected:
  route: escalate
  notes: >
    self_check should fail this (or needs_retry -> still nothing found -> escalate) because
    there is no order data in the knowledge base to ground a status claim. This is the
    self_check-triggered escalation path, not the risk gate.
