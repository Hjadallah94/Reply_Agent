description: >
  Order-status question with no order data available (Phase 1 has no live order/spreadsheet
  integration yet — that's Phase 2, Doc 2 Section 2.6). Tests the core hallucination guardrail:
  the agent must not invent an order status.
turns:
  - role: customer
    text: "مرحبا، بدي اعرف وين صار طلبي يلي عملته امبارح؟"
expected:
  route: escalate
  intent_label: order_status
  has_draft: true
  notes: >
    Deterministic capability-gap escalation (risk_rules.py NO_CAPABILITY_LABELS), not a
    self_check judgment call — order_status always escalates in Phase 1 regardless of how
    honest/well-grounded the hedge reply is, since the agent structurally can't answer yet
    (no order integration until Phase 2).
